<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Kring app icon · concept 1 "The bump": anchan ring + marigold ring, violet lens where they overlap, on Bangkok night -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="108%" r="95%">
      <stop offset="0%" stop-color="#3446FF" stop-opacity=".55" />
      <stop offset="62%" stop-color="#0A0B1E" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="#0A0B1E" />
  <rect width="512" height="512" rx="116" fill="url(#bg)" />
  <path d="M256 166.6A104 104 0 0 1 256 345.4A104 104 0 0 1 256 166.6Z" fill="#9B5CFF" opacity=".95" filter="url(#glow)" />
  <circle cx="196" cy="256" r="104" fill="none" stroke="#7381FF" stroke-width="22" filter="url(#glow)" />
  <circle cx="316" cy="256" r="104" fill="none" stroke="#FFB21E" stroke-width="22" />
</svg>
